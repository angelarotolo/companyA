<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You for Signing Up</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f7f7f7;
        color: #333;
    }

    .container {
        max-width: 700px;
        margin: 60px auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 50px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .logo {
        margin-bottom: 30px;
    }

    .logo img {
        max-width: 220px;
        height: auto;
    }

    h1 {
        font-size: 36px;
        color: #1a1a1a;
        margin-bottom: 15px;
    }

    .subcopy {
        font-size: 18px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 40px;
    }

    .cta-wrapper {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .cta-btn {
        display: inline-block;
        min-width: 250px;
        padding: 16px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
        transition: all .2s ease;
    }

    .apple-wallet {
        background: #000000;
        color: white;
    }

    .apple-wallet:hover {
        background: #222222;
    }

    .google-wallet {
        background: #1A73E8;
        color: white;
    }

    .google-wallet:hover {
        background: #0f59b5;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px;
            margin: 20px;
        }

        .cta-btn {
            width: 100%;
        }
    }
</style>
</head>
<body>

<div class="container">

    <!-- Brand Logo -->
    <div class="logo">
        logo.png
    </div>

    <!-- Success Message -->
    <h1>Thank You for Signing Up!</h1>

    <!-- Editable Subcopy -->
    <div class="subcopy">
        Your $5 coupon is ready. Save it to your Apple Wallet or Google Wallet now and present it at checkout before it expires.
    </div>

    <!-- Wallet CTAs -->
    <div class="cta-wrapper">
        {{APPLE_WALLET_URL}}
            Add $5 Coupon to Apple Wallet
        </a>

        {{GOOGLE_WALLET_URL}}
            Add $5 Coupon to Google Wallet
        </a>
    </div>

</div>

<!-- Hidden Fields for Wallet Generation -->
<form id="walletData" style="display:none;">

    <input type="hidden" name="communication_id" value="{{communication_id}}">
    
    <input type="hidden" name="expiration_date" value="{{expiration_date}}">
    
    <input type="hidden" name="redeemed_date" value="{{redeemed_date}}">
    
    <input type="hidden" name="Fname" value="{{Fname}}">
    
    <input type="hidden" name="Lname" value="{{Lname}}">
    
    <input type="hidden" name="Inmar_UPC" value="{{Inmar_UPC}}">
    
    <input type="hidden" name="coupon_value" value="{{coupon_value}}">

</form>

</body>
</html>
